# ============================================================
# AI-IDS — Central Experiment Configuration
# ============================================================

# --- Which dataset to use ---
active_dataset: CIC-IDS2017

# --- Dataset definitions (extensible) ---
datasets:
  CIC-IDS2017:
    name: CIC-IDS2017
    data_dir: dataset/CIC-IDS2017
    file_format: parquet
    files:
      - Benign-Monday.parquet
      - Bruteforce-Tuesday.parquet
      - DoS-Wednesday.parquet
      - Infiltration-Webattacks-Thursday.parquet
      - Portscan-DDos-Botnet-Friday.parquet

    target_column: Label

    # Labels to drop before processing
    drop_labels:
      - Attempted

    # Binary label mapping
    label_mapping:
      type: binary
      benign_label: Benign  

    # Day mapping for temporal split
    day_mapping:
      Benign-Monday.parquet: Monday
      Bruteforce-Tuesday.parquet: Tuesday
      DoS-Wednesday.parquet: Wednesday
      Infiltration-Webattacks-Thursday.parquet: Thursday
      Portscan-DDos-Botnet-Friday.parquet: Friday

    temporal_split:
      train_days: [Monday, Tuesday, Wednesday]
      test_days: [Thursday, Friday]
      val_fraction_from_train: 0.1765 

    drop_columns: []

    # Feature definitions
    features:
      numeric:
        - Protocol
        - Flow Duration
        - Total Fwd Packets
        - Total Backward Packets
        - Fwd Packets Length Total
        - Bwd Packets Length Total
        - Fwd Packet Length Max
        - Fwd Packet Length Min
        - Fwd Packet Length Mean
        - Fwd Packet Length Std
        - Bwd Packet Length Max
        - Bwd Packet Length Min
        - Bwd Packet Length Mean
        - Bwd Packet Length Std
        - Flow Bytes/s
        - Flow Packets/s
        - Flow IAT Mean
        - Flow IAT Std
        - Flow IAT Max
        - Flow IAT Min
        - Fwd IAT Total
        - Fwd IAT Mean
        - Fwd IAT Std
        - Fwd IAT Max
        - Fwd IAT Min
        - Bwd IAT Total
        - Bwd IAT Mean
        - Bwd IAT Std
        - Bwd IAT Max
        - Bwd IAT Min
        - Fwd PSH Flags
        - Bwd PSH Flags
        - Fwd URG Flags
        - Bwd URG Flags
        - Fwd RST Flags
        - Bwd RST Flags
        - Fwd Header Length
        - Bwd Header Length
        - Fwd Packets/s
        - Bwd Packets/s
        - Packet Length Min
        - Packet Length Max
        - Packet Length Mean
        - Packet Length Std
        - Packet Length Variance
        - FIN Flag Count
        - SYN Flag Count
        - RST Flag Count
        - PSH Flag Count
        - ACK Flag Count
        - URG Flag Count
        - CWR Flag Count
        - ECE Flag Count
        - Down/Up Ratio
        - Avg Packet Size
        - Avg Fwd Segment Size
        - Avg Bwd Segment Size
        - Fwd Avg Bytes/Bulk
        - Fwd Avg Packets/Bulk
        - Fwd Avg Bulk Rate
        - Bwd Avg Bytes/Bulk
        - Bwd Avg Packets/Bulk
        - Bwd Avg Bulk Rate
        - Subflow Fwd Packets
        - Subflow Fwd Bytes
        - Subflow Bwd Packets
        - Subflow Bwd Bytes
        - Init Fwd Win Bytes
        - Init Bwd Win Bytes
        - Fwd Act Data Packets
        - Fwd Seg Size Min
        - Active Mean
        - Active Std
        - Active Max
        - Active Min
        - Idle Mean
        - Idle Std
        - Idle Max
        - Idle Min
        - ICMP Code
        - ICMP Type
        - Total TCP Flow Time
      categorical: []  


# --- Classification ---
classification:
  type: binary
  positive_label: 1  
  negative_label: 0  

# --- Preprocessing ---
preprocessing:
  handle_inf: replace_with_nan
  imputer_strategy: median
  scaling: standard
  feature_selection:
    drop_zero_variance: true
    drop_high_correlation: true
    correlation_threshold: 0.95

# --- Splitting ---
splitting:
  strategies: [random, temporal]
  random_state: 42
  random:
    train_size: 0.70
    validation_size: 0.15
    test_size: 0.15
    stratify: true

# --- Models ---
models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
    solver: lbfgs
    random_state: 42
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1

# --- Imbalance ---
imbalance:
  strategies: [smote, undersampling]
  smote:
    sampling_strategy: auto
    k_neighbors: 5
    random_state: 42
  undersampling:
    method: RandomUnderSampler
    sampling_strategy: auto
    random_state: 42

# --- Experiments ---
experiments:
  - name: EXP-01
    model: logistic_regression
    strategy: smote
  - name: EXP-02
    model: random_forest
    strategy: smote
  - name: EXP-03
    model: logistic_regression
    strategy: undersampling
  - name: EXP-04
    model: random_forest
    strategy: undersampling

# --- Evaluation ---
evaluation:
  primary_metrics:
    - f1_attack
    - recall_attack
    - macro_f1
    - pr_auc
  secondary_metrics:
    - accuracy
    - fpr
    - fnr
  confusion_matrix: true
  pr_curve: true
  classification_report: true

# --- Output ---
output:
  splits_dir: dataset/{dataset_name}/splits
  models_dir: models
  preprocessors_dir: models/preprocessors
  results_dir: results
  metrics_dir: results/metrics
  confusion_dir: results/confusion_matrices
  pr_curves_dir: results/pr_curves
  predictions_dir: results/predictions