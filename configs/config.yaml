# --- Evaluation ---
evaluation:
  primary_metrics:
    - f1_attack
    - recall_attack
    - macro_f1
    - pr_auc
  secondary_metrics:
    - accuracy
    - fpr
    - fnr
  confusion_matrix: true
  pr_curve: true
  classification_report: true

# --- Output ---
output:
  splits_dir: dataset/{dataset_name}/splits
  models_dir: models
  preprocessors_dir: models/preprocessors
  results_dir: results
  metrics_dir: results/metrics
  confusion_dir: results/confusion_matrices
  pr_curves_dir: results/pr_curves
  predictions_dir: results/predictions