# Lint, tests, a pipeline smoke run and the deployable images, on every push to main and every PR.
# The GPU pipeline image (root Dockerfile, CUDA PyTorch, ~10 GB) is not built here: the pipeline
# job runs the same code on CPU instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "$(grep '^ruff' requirements/dev.txt)"
      - run: ruff check --output-format github .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ids
          POSTGRES_PASSWORD: ids
          POSTGRES_DB: ids_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ids -d ids_test" --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/test.txt
      # API, inference (tiny bundle), flow extractor, OpenAPI freshness; the default SQLite setup first
      - name: pytest (SQLite)
        run: pytest -q
      - name: pytest (Postgres + Redis)
        env:
          IDS_TEST_DATABASE_URL: postgresql+psycopg://ids:ids@127.0.0.1:5432/ids_test
          IDS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -q

  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      # CPU PyTorch first, so requirements.txt doesn't pull the CUDA build
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      # prepare -> train -> evaluate -> build_bundle -> load on a tiny synthetic dataset
      - run: python scripts/pipeline_smoke.py

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: API + worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          tags: ai-ids-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image (next build)
        uses: docker/build-push-action@v7
        with:
          context: web
          tags: ai-ids-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: The API image imports the app and the flow extractor
        run: docker run --rm ai-ids-api:ci python -c "import src.api.main, src.api.worker.tasks, src.flowmeter"
      - name: Compose file is valid
        run: docker compose --profile app --profile tunnel --profile quick-tunnel --profile mail --profile pipeline --profile test config --quiet
