# Lint for CI (.github/workflows/ci.yml): `ruff check .`
line-length = 120
target-version = "py313"
extend-exclude = ["web", "dataset", "models", "results", "model_store", "data", "backups", "*.ipynb"]

[lint]
# pyflakes (undefined names, unused imports and variables) + pycodestyle's error classes
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]               # `l` / `I` as names in numeric code

[lint.per-file-ignores]
"scripts/*" = ["E402"]          # sys.path gets the project root before the project imports
"__init__.py" = ["F401"]        # package re-exports
