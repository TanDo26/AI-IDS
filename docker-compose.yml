version: "3.8"

services:
  ids:
    build: .
    container_name: ai-ids
    volumes:
      - .:/app
      - ./dataset:/app/dataset
      - ./models:/app/models
      - ./results:/app/results
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prepare:
    extends:
      service: ids
    command: ["scripts/prepare_data.py"]

  train:
    extends:
      service: ids
    command: ["scripts/train_all.py"]

  evaluate:
    extends:
      service: ids
    command: ["scripts/evaluate_all.py"]

  run-all:
    extends:
      service: ids
    command: ["scripts/run_all.py"]

  hpo:
    extends:
      service: ids
    command: ["scripts/optimize_hpo.py"]

  xai:
    extends:
      service: ids
    command: ["scripts/xai_analysis.py"]

  api:
    extends:
      service: ids
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - IDS_EXP_NAME=EXP-02
      - IDS_MODEL_TYPE=random_forest
      - IDS_SPLIT=random
      - IDS_LABEL_TYPE=binary
    entrypoint: ["python", "-m", "uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    command: []